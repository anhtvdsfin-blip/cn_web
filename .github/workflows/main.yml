name: Deploy Docker Node.js to EC2

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.APP_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Save Docker image
        run: |
          docker save ${{ secrets.APP_NAME }}:${{ env.IMAGE_TAG }} \
            | gzip > image.tar.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy image to EC2
        run: |
          scp image.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            docker stop ${{ secrets.APP_NAME }} || true
            docker rm ${{ secrets.APP_NAME }} || true

            gunzip -c /home/ubuntu/image.tar.gz | docker load

            docker run -d \
              --name ${{ secrets.APP_NAME }} \
              -p ${{ secrets.APP_PORT }}:${{ secrets.APP_PORT }} \
              --restart unless-stopped \
              ${{ secrets.APP_NAME }}:${{ env.IMAGE_TAG }}

            docker image prune -f
          EOF
